[package]
name = "delta-force"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.1.0"
bytes = "1.12.1"
futures = "0.3.34"
object_store = "0.14.2"
parquet = "60.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = "1.54.1"
uuid = { version = "1.29.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
