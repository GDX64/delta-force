[package]
name = "delta-force"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
bytes = "1.12.1"
delta_kernel = { version = "0.30.1", features = ["internal-api"] }
delta_kernel_default_engine = "0.30.1"
object_store = "0.14"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
url = "2.5.8"
