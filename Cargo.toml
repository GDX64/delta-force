[package]
name = "delta-force"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
async-trait = "0.1"
bytes = "1.12.1"
delta_kernel = { version = "0.30.1", features = ["internal-api"] }
delta_kernel_default_engine = "0.30.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
object_store = "0.14"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[features]
# Test helpers for benchmarks: `test_util::TestStore` with virtual files.
test-util = []

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
url = "2.5.8"
